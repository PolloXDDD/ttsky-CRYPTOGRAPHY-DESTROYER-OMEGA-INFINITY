project:
  title:        "OMEGA INFINITY KAORU 3D 16M-Variable SAT Engine"
  author:       "Kaoru Aguilera Katayama"
  discord:      ""
  description:  "3D Volumetric 256x256x256 GRID interface addressing 16,777,215 Boolean variables"
  language:     "Verilog"
  clock_hz:     10000000

  top_module:   "tt_um_omega_infinity_kaoru"

  source_files:
    - "project.v"

tiles: "1x1"

pinout:
  ui[0]: "coord_or_data[0] / prog_op[0]"
  ui[1]: "coord_or_data[1] / prog_op[1]"
  ui[2]: "coord_or_data[2] / prog_op[2]"
  ui[3]: "coord_or_data[3] / prog_a[0]"
  ui[4]: "coord_or_data[4] / prog_a[1]"
  ui[5]: "coord_or_data[5] / prog_a[2]"
  ui[6]: "coord_or_data[6] / prog_a[3]"
  ui[7]: "coord_or_data[7] / prog_a[4]"

  uo[0]: "SAT"
  uo[1]: "UNSAT"
  uo[2]: "DONE"
  uo[3]: "assignment[0]"
  uo[4]: "assignment[1]"
  uo[5]: "assignment[2]"
  uo[6]: "assignment[3]"
  uo[7]: "assignment[4]"

  uio[0]: "prog_en (1=prog/stream, 0=eval)"
  uio[1]: "stream_addr (1=addr, 0=gate)"
  uio[2]: "we_pulse (write strobe)"
  uio[3]: "grid_stable (relaxation trigger)"
  uio[4]: "byte_sel[0] (00=X, 01=Y, 10=Z)"
  uio[5]: "byte_sel[1]"
  uio[6]: "var_val_in (quantized bit)"
  uio[7]: "load_tap_val (cache bit)"
