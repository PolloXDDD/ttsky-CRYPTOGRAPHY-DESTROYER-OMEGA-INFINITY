project:
  title:        "OMEGA INFINITY KAORU Universal SAT Engine"
  author:       "Kaoru Aguilera Katayama"
  discord:      ""
  description:  "Universal programmable Circuit-SAT solving stage capable of evaluating arbitrary Boolean DAG instances"
  language:     "Verilog"
  clock_hz:     10000000

  top_module:   "tt_um_omega_infinity_kaoru"

  source_files:
    - "project.v"

tiles: "1x1"

pinout:
  ui[0]: "grid_tap v0 / prog_op[0]"
  ui[1]: "grid_tap v1 / prog_op[1]"
  ui[2]: "grid_tap v2 / prog_op[2]"
  ui[3]: "grid_tap v3 / prog_a[0]"
  ui[4]: "grid_tap v4 / prog_a[1]"
  ui[5]: "grid_tap v5 / prog_a[2]"
  ui[6]: "grid_tap v6 / prog_a[3]"
  ui[7]: "grid_tap v7 / prog_a[4]"

  uo[0]: "SAT"
  uo[1]: "UNSAT"
  uo[2]: "DONE"
  uo[3]: "node_out[3] / wr_ptr[0]"
  uo[4]: "node_out[4] / wr_ptr[1]"
  uo[5]: "node_out[5] / wr_ptr[2]"
  uo[6]: "node_out[6] / wr_ptr[3]"
  uo[7]: "node_out[7] / wr_ptr[4]"

  uio[0]: "prog_en (1=prog, 0=eval)"
  uio[1]: "prog_we (write strobe)"
  uio[2]: "prog_rst_ptr (reset write address)"
  uio[3]: "grid_stable (trigger decision)"
  uio[4]: "prog_b[0] / out_gate[0]"
  uio[5]: "prog_b[1] / out_gate[1]"
  uio[6]: "prog_b[2] / out_gate[2]"
  uio[7]: "prog_b[3] / out_gate[3]"
