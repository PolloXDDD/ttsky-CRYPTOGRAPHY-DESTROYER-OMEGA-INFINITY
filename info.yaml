project:
  title:        "OMEGA INFINITY KAORU 3D Metal Grid Processor"
  author:       "Kaoru Aguilera Katayama"
  discord:      ""
  description:  "Physical BEOL 3D metal wire grid mesh coupled to a CMOS Circuit-SAT engine"
  language:     "Verilog"
  clock_hz:     10000000

  top_module:   "tt_um_omega_infinity_kaoru"

  source_files:
    - "project.v"

tiles: "1x1"

pinout:
  ui[0]: "prog_op[0]"
  ui[1]: "prog_op[1]"
  ui[2]: "prog_op[2]"
  ui[3]: "prog_a[0]"
  ui[4]: "prog_a[1]"
  ui[5]: "prog_a[2]"
  ui[6]: "prog_a[3]"
  ui[7]: "prog_a[4]"

  uo[0]: "SAT"
  uo[1]: "UNSAT"
  uo[2]: "DONE"
  uo[3]: "tap_out[0]"
  uo[4]: "tap_out[1]"
  uo[5]: "tap_out[2]"
  uo[6]: "tap_out[3]"
  uo[7]: "tap_out[4]"

  uio[0]: "prog_en (1=prog, 0=run)"
  uio[1]: "prog_we (write strobe)"
  uio[2]: "unused"
  uio[3]: "grid_stable (relaxation trigger)"
  uio[4]: "prog_b[0]"
  uio[5]: "prog_b[1]"
  uio[6]: "prog_b[2]"
  uio[7]: "prog_b[3]"
